<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coconut Plucking</title>
  <meta name="description" content="Track coconut plucking, dehusking and sales sessions, stored in Google Sheets.">
  <meta name="theme-color" content="#2f7d4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Coconut Plucking</a>
      <button id="syncBtn" class="sync" type="button" title="Sync now"><span class="dot"></span><span id="syncText">Offline</span></button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="sessions"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Sessions</a>
    <a href="#/dues" data-tab="dues"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Dues</a>
    <a href="#/analytics" data-tab="analytics"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Analytics</a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Settings</a>
  </nav>

  <div id="counter" class="counter-screen" role="dialog" aria-label="Tree counter" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
